<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PC5 Panel</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#2f81f7; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 10px 0 0; }
  button { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 11px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.ok { background:#1a7f37; border-color:#1a7f37; color:#fff; }
  button.bad { background:#a3302c; border-color:#a3302c; color:#fff; }
  main { padding:14px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dim { color:var(--dim); }
  .mono { font-family:ui-monospace,monospace; font-size:12px; }
  input, textarea, select { background:#0d1117; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px; font:inherit; width:100%; }
  textarea { min-height:90px; resize:vertical; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; border:1px solid var(--line); }
  .pill.pending { color:#d29922; border-color:#d29922; }
  .pill.paid, .pill.approved { color:var(--ok); border-color:var(--ok); }
  .pill.rejected { color:var(--bad); border-color:var(--bad); }
  .pill.awaiting_payment { color:var(--dim); }
  .shot { max-width:150px; border-radius:6px; border:1px solid var(--line); cursor:zoom-in; display:block; }
  #login { max-width:340px; margin:14vh auto; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tabs button.active { background:var(--acc); border-color:var(--acc); color:#fff; }
  #modal { position:fixed; inset:0; background:#000d; display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
  #modal img { max-width:100%; max-height:100%; }
  .hidden { display:none !important; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); padding:9px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h1 style="font-size:16px;margin:0 0 10px">PC5 Panel</h1>
    <input id="pw" type="password" placeholder="Panel password" />
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="login()">Sign in</button>
      <span id="loginErr" class="dim"></span>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>PC5</h1>
    <span id="rev" class="dim mono"></span>
    <span id="live" class="pill">offline</span>
    <span style="flex:1"></span>
    <button onclick="load()">Refresh</button>
    <button onclick="logout()">Sign out</button>
  </header>
  <main>
    <div class="tabs">
      <button data-tab="orders" class="active">Payments</button>
      <button data-tab="users">Users</button>
      <button data-tab="stock">Stock</button>
      <button data-tab="settings">Settings</button>
      <button data-tab="log">Log</button>
    </div>
    <section id="tab-orders"></section>
    <section id="tab-users" class="hidden"></section>
    <section id="tab-stock" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
    <section id="tab-log" class="hidden"></section>
  </main>
</div>

<div id="modal" onclick="this.style.display='none'"><img id="modalImg" /></div>
<div id="toast"></div>

<script>
let S = null;
let es = null;

const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function call(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-panel': '1' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { showLogin(); throw new Error('auth'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'failed');
  return j;
}

async function login() {
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value }),
    });
    if (!r.ok) { $('loginErr').textContent = 'Wrong password'; return; }
    start();
  } catch { $('loginErr').textContent = 'Network error'; }
}

async function logout() {
  await fetch('/api/login', { method: 'POST' }).catch(() => {});
  document.cookie = 'sid=; Max-Age=0; Path=/';
  showLogin();
}

function showLogin() {
  if (es) { es.close(); es = null; }
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
}

function start() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  load();
  connect();
}

function connect() {
  if (es) es.close();
  es = new EventSource('/api/stream');
  es.addEventListener('state', (e) => {
    const d = JSON.parse(e.data);
    $('live').textContent = 'live';
    $('live').style.color = 'var(--ok)';
    if (!S || d.rev !== S.rev) load();
  });
  es.onerror = () => {
    $('live').textContent = 'reconnecting';
    $('live').style.color = 'var(--bad)';
  };
}

async function load() {
  try {
    S = await call('GET', '/api/state');
  } catch { return; }
  $('rev').textContent = 'rev ' + S.rev;
  render();
}

function render() {
  renderOrders();
  renderUsers();
  renderStock();
  renderSettings();
  if (!$('tab-log').classList.contains('hidden')) loadLog();
}

const money = (p) => '₹' + (p / 100).toFixed(2);
const when = (t) => new Date(t).toLocaleString();

function renderOrders() {
  const orders = S.orders.slice().reverse();
  const pending = orders.filter((o) => o.status === 'pending_review');
  const rest = orders.filter((o) => o.status !== 'pending_review').slice(0, 60);

  const row = (o, isPending) => `
    <tr>
      <td class="mono">${o.id}</td>
      <td>${userLabel(o.userId)}</td>
      <td>${o.amount ? money(o.amount) : '-'}</td>
      <td><span class="pill ${o.status}">${o.status}</span></td>
      <td class="dim">${when(o.createdAt)}</td>
      <td>${o.shot ? `<img class="shot" src="/api/shot/${o.id}?v=${o.reviewedAt || o.submittedAt || o.createdAt}" onclick="zoom(this.src)" />` : '<span class="dim">—</span>'}</td>
      <td>${isPending ? `<div class="row"><button class="ok" onclick="approve('${o.id}')">Approve</button><button class="bad" onclick="reject('${o.id}')">Reject</button></div>` : ''}</td>
    </tr>`;

  $('tab-orders').innerHTML = `
    <div class="card">
      <div class="row"><strong>Awaiting review</strong><span class="pill pending">${pending.length}</span></div>
      ${pending.length ? `<table style="margin-top:8px"><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Status</th><th>Sent</th><th>Proof</th><th></th></tr></thead><tbody>${pending.map((o) => row(o, true)).join('')}</tbody></table>` : '<p class="dim">Nothing pending.</p>'}
    </div>
    <div class="card">
      <strong>History</strong>
      <table style="margin-top:8px"><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Status</th><th>Created</th><th>Proof</th><th></th></tr></thead><tbody>${rest.map((o) => row(o, false)).join('')}</tbody></table>
    </div>`;
}

function userLabel(id) {
  const u = S.users[id];
  return u ? `${u.name}${u.username ? ' (@' + u.username + ')' : ''}<div class="dim mono">${id}</div>` : `<span class="mono dim">${id}</span>`;
}

function zoom(src) {
  $('modalImg').src = src;
  $('modal').style.display = 'flex';
}

async function approve(id) {
  try { await call('POST', `/api/orders/${id}/approve`); toast('Approved'); } catch (e) { toast(e.message); }
}
async function reject(id) {
  const note = prompt('Reason (optional)') || '';
  try { await call('POST', `/api/orders/${id}/reject`, { note }); toast('Rejected'); } catch (e) { toast(e.message); }
}

function renderUsers() {
  const users = Object.values(S.users).sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
  const online = users.filter((u) => Date.now() - (u.lastSeen || 0) < 5 * 60 * 1000).length;

  $('tab-users').innerHTML = `
    <div class="card">
      <div class="row"><strong>Users</strong><span class="dim">${users.length} total · ${online} active in 5 min</span></div>
      <table style="margin-top:8px"><thead><tr><th>User</th><th>Balance</th><th>Flags</th><th>Last seen</th><th>Actions</th></tr></thead><tbody>
      ${users.map((u) => `
        <tr>
          <td>${u.name}${u.username ? ' (@' + u.username + ')' : ''}<div class="dim mono">${u.id}</div></td>
          <td>${money(u.balance)}</td>
          <td>${u.reseller ? '<span class="pill">reseller</span> ' : ''}${u.banned ? '<span class="pill rejected">banned</span>' : ''}</td>
          <td class="dim">${u.lastSeen ? when(u.lastSeen) : '-'}</td>
          <td><div class="row">
            <button onclick="credit('${u.id}')">Credit</button>
            <button onclick="flag('${u.id}','reseller',${!u.reseller})">${u.reseller ? 'Unreseller' : 'Reseller'}</button>
            <button onclick="flag('${u.id}','banned',${!u.banned})">${u.banned ? 'Unban' : 'Ban'}</button>
            <button onclick="dm('${u.id}')">Message</button>
          </div></td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
}

async function credit(id) {
  const v = prompt('Amount in rupees (negative to deduct)');
  if (!v) return;
  try { await call('POST', `/api/users/${id}/balance`, { rupees: Number(v) }); toast('Updated'); } catch (e) { toast(e.message); }
}
async function flag(id, key, val) {
  try { await call('POST', `/api/users/${id}/flags`, { [key]: val }); toast('Updated'); } catch (e) { toast(e.message); }
}
async function dm(id) {
  const text = prompt('Message');
  if (!text) return;
  try { await call('POST', `/api/users/${id}/message`, { text }); toast('Sent'); } catch (e) { toast(e.message); }
}

async function renderStock() {
  let counts = {};
  try { counts = await call('GET', '/api/stock'); } catch {}

  $('tab-stock').innerHTML = `
    <div class="card">
      <strong>Stock</strong>
      <table style="margin-top:8px"><thead><tr><th>Plan</th><th>Available</th><th>Total</th></tr></thead><tbody>
      ${S.settings.plans.map((p) => {
        const c = counts[p.id] || { available: 0, total: 0 };
        return `<tr><td>${p.name}<div class="dim mono">${p.id}</div></td><td>${c.available}</td><td>${c.total}</td></tr>`;
      }).join('')}
      </tbody></table>
    </div>
    <div class="card">
      <strong>Add keys</strong>
      <div class="row" style="margin:8px 0">
        <select id="stockPlan" style="flex:1">${S.settings.plans.map((p) => `<option value="${p.id}">${p.name}</option>`).join('')}</select>
      </div>
      <textarea id="stockKeys" placeholder="One key per line, or comma separated"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" onclick="addKeys()">Add</button>
        <input id="genCount" type="number" value="10" style="width:90px" />
        <input id="genPrefix" value="PC5" style="width:110px" />
        <button onclick="genKeys()">Generate</button>
        <button onclick="purgeSold()">Purge sold</button>
      </div>
    </div>`;
}

async function addKeys() {
  const planId = $('stockPlan').value;
  const keys = $('stockKeys').value;
  try {
    const r = await call('POST', '/api/stock/add', { planId, keys });
    $('stockKeys').value = '';
    toast(`Added ${r.added}`);
  } catch (e) { toast(e.message); }
}
async function genKeys() {
  const planId = $('stockPlan').value;
  try {
    const r = await call('POST', '/api/stock/generate', { planId, count: Number($('genCount').value), prefix: $('genPrefix').value });
    toast(`Generated ${r.added}`);
  } catch (e) { toast(e.message); }
}
async function purgeSold() {
  const planId = $('stockPlan').value;
  try {
    const r = await call('POST', '/api/stock/remove', { planId });
    toast(`Removed ${r.removed} sold`);
  } catch (e) { toast(e.message); }
}

function renderSettings() {
  const s = S.settings;
  $('tab-settings').innerHTML = `
    <div class="card">
      <div class="row"><strong>Maintenance</strong><input type="checkbox" id="maintenance" ${s.maintenance ? 'checked' : ''} style="width:auto" /></div>
      <label class="dim">Banner</label>
      <textarea id="banner">${esc(s.banner)}</textarea>
      <label class="dim">UPI ID</label><input id="upiId" value="${esc(s.upiId)}" />
      <label class="dim">UPI Name</label><input id="upiName" value="${esc(s.upiName)}" />
      <div class="row" style="margin-top:8px">
        <div style="flex:1"><label class="dim">Reseller fee (₹)</label><input id="resellerFee" type="number" value="${s.resellerFee / 100}" /></div>
        <div style="flex:1"><label class="dim">Reseller discount (%)</label><input id="resellerDiscount" type="number" value="${s.resellerDiscount}" /></div>
      </div>
      <button class="primary" style="margin-top:10px" onclick="saveSettings()">Save</button>
    </div>
    <div class="card">
      <strong>Plans</strong>
      <table style="margin-top:8px"><thead><tr><th>ID</th><th>Name</th><th>Price ₹</th><th></th></tr></thead><tbody>
      ${s.plans.map((p, i) => `<tr>
        <td class="mono">${p.id}</td>
        <td><input value="${esc(p.name)}" onchange="S.settings.plans[${i}].name=this.value" /></td>
        <td><input type="number" value="${p.price / 100}" onchange="S.settings.plans[${i}].price=Math.round(this.value*100)" /></td>
        <td><button class="bad" onclick="S.settings.plans.splice(${i},1);renderSettings()">×</button></td>
      </tr>`).join('')}
      </tbody></table>
      <button style="margin-top:8px" onclick="addPlan()">Add plan</button>
    </div>
    <div class="card">
      <strong>Sync</strong>
      <div class="row" style="margin-top:8px">
        <button onclick="push()">Push now</button>
        <button onclick="pull()">Pull remote</button>
        <span id="syncMsg" class="dim"></span>
      </div>
    </div>`;
}

const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function addPlan() {
  const id = 'p' + (S.settings.plans.length + 1) + '_' + Date.now().toString(36).slice(-3);
  S.settings.plans.push({ id, name: 'New plan', price: 1000, devices: 1 });
  renderSettings();
}

async function saveSettings() {
  try {
    await call('POST', '/api/settings', {
      maintenance: $('maintenance').checked,
      banner: $('banner').value,
      upiId: $('upiId').value,
      upiName: $('upiName').value,
      resellerFee: Number($('resellerFee').value),
      resellerDiscount: Number($('resellerDiscount').value),
      plans: S.settings.plans,
      tiers: S.settings.tiers,
    });
    toast('Saved');
  } catch (e) { toast(e.message); }
}

async function push() {
  try { const r = await call('POST', '/api/sync/push'); $('syncMsg').textContent = r.ok ? 'pushed' : 'failed'; } catch (e) { $('syncMsg').textContent = e.message; }
}
async function pull() {
  try { const r = await call('POST', '/api/sync/pull'); $('syncMsg').textContent = r.ok ? 'pulled' : r.reason; } catch (e) { $('syncMsg').textContent = e.message; }
}

async function loadLog() {
  let log = [];
  try { log = await call('GET', '/api/log'); } catch {}
  $('tab-log').innerHTML = `<div class="card mono">${log.map((l) => `<div>${new Date(l.at).toLocaleTimeString()} · ${l.kind} · ${esc(l.text)}</div>`).join('') || '<span class="dim">Empty</span>'}</div>`;
}

document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    for (const t of ['orders', 'users', 'stock', 'settings', 'log']) {
      $('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab);
    }
    if (b.dataset.tab === 'log') loadLog();
  };
});

$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

(async () => {
  try {
    const r = await fetch('/api/me');
    if (r.ok) start(); else showLogin();
  } catch { showLogin(); }
})();
</script>
</body>
</html>
