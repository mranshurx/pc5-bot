<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>PC5 Bot Control</title>
<style>
  :root{--bg:#08080b;--card:#111116;--line:#22222b;--acc:#ff2a44;--txt:#e6e6ea;--mut:#8b8b95;--ok:#10b981;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,monospace}
  header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  h1{font-size:14px;letter-spacing:.16em;margin:0;text-transform:uppercase}h1 span{color:var(--acc)}
  .wrap{padding:20px;max-width:1320px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .stat b{display:block;font-size:22px;color:#fff}
  .stat i{font-style:normal;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
  .cols{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
  @media(max-width:980px){.cols{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;padding:8px;color:var(--mut);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid #17171e;vertical-align:middle}
  input,select,textarea{width:100%;background:#0a0a0e;border:1px solid var(--line);color:#fff;border-radius:6px;padding:7px 9px;font:inherit;font-size:12px}
  textarea{font-size:11px;line-height:1.7}
  button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 11px;font:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
  button.ghost{background:#1a1a22;border:1px solid var(--line)}button.ok{background:var(--ok)}button.warn{background:var(--warn);color:#000}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tag{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
  .tag.rsl{background:rgba(16,185,129,.15);color:#34d399}.tag.norm{background:#1e1e26;color:#9a9aa4}
  .tag.banned{background:rgba(239,68,68,.15);color:#f87171}.tag.pend{background:rgba(245,158,11,.15);color:#f59e0b}
  .tag.ok{background:rgba(16,185,129,.15);color:#34d399}.tag.rej{background:rgba(239,68,68,.15);color:#f87171}
  .shot{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
  .key{font-size:11px;color:#dcdce2}
  #login{position:fixed;inset:0;background:#05050a;display:flex;align-items:center;justify-content:center;z-index:50}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(340px,90vw);text-align:center}
  #toast{position:fixed;right:18px;bottom:18px;background:#1a1a22;border:1px solid #33333f;padding:10px 14px;border-radius:8px;display:none;z-index:99;max-width:70vw}
  .muted{color:var(--mut)}.small{font-size:11px}.low{color:#f59e0b}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  #modal img{max-width:92vw;max-height:88vh;border-radius:10px}
</style>
</head>
<body>
<div id="login"><div class="box">
  <h1>PC5 <span>BOT CONTROL</span></h1>
  <p class="muted small">panel password</p>
  <input id="pw" type="password" style="text-align:center;margin-bottom:10px" />
  <button id="pwBtn" style="width:100%">Unlock</button>
  <p id="pwErr" class="small" style="color:#f87171;display:none">wrong password</p>
</div></div>

<header><h1>PC5 <span>BOT CONTROL</span></h1><div class="row">
  <button class="ghost" id="backup">Backup</button>
  <button class="ghost" id="restoreBtn">Restore</button>
  <input type="file" id="restoreFile" accept="application/json" hidden />
  <button class="ghost" id="refresh">Refresh</button>
  <button class="ghost" id="logout">Logout</button>
</div></header>

<div class="wrap">
  <div class="grid" id="stats"></div>
  <div class="cols">
    <div>
      <div class="card"><h2>Add Keys To Stock</h2>
        <div class="row"><select id="addPlan" style="flex:2"></select>
          <select id="addDev" style="flex:1"><option value="single">1 device</option><option value="unlimited">unlimited</option></select></div>
        <textarea id="addKeys" rows="6" placeholder="Paste keys — one per line or comma separated" style="margin-top:8px"></textarea>
        <div class="row" style="margin-top:8px"><button id="addBtn">Add</button><span class="muted small">or</span>
          <input id="genCount" type="number" value="10" style="width:70px" /><button class="ghost" id="genBtn">Generate</button></div>
      </div>
      <div class="card"><h2>Stock</h2>
        <table><thead><tr><th>Plan</th><th>1 device</th><th>Unlimited</th></tr></thead><tbody id="stockSummary"></tbody></table>
        <input id="stockFilter" placeholder="filter keys" style="margin:12px 0 8px" />
        <table><thead><tr><th>Key</th><th>Plan</th><th>Device</th><th></th></tr></thead><tbody id="stockList"></tbody></table>
      </div>
      <div class="card"><h2>Pending Review</h2>
        <table><thead><tr><th>#</th><th>User</th><th>Type</th><th>Amount</th><th>Proof</th><th></th></tr></thead><tbody id="pending"></tbody></table>
      </div>
      <div class="card"><h2>Users</h2>
        <input id="search" placeholder="search id / username" style="margin-bottom:10px" />
        <table><thead><tr><th>ID</th><th>User</th><th>Tier</th><th>Credit</th><th>Keys</th><th></th></tr></thead><tbody id="users"></tbody></table>
      </div>
      <div class="card"><h2>Orders</h2>
        <table><thead><tr><th>#</th><th>User</th><th>Type</th><th>Amount</th><th>Status</th><th>Key</th></tr></thead><tbody id="orders"></tbody></table>
      </div>
      <div class="card"><h2>Log</h2><div id="log" class="small muted"></div></div>
    </div>
    <div>
      <div class="card"><h2>Settings</h2>
        <label class="small muted">UPI ID</label><input id="upiId" />
        <label class="small muted">UPI Name</label><input id="upiName" />
        <label class="small" style="display:block;margin:10px 0"><input type="checkbox" id="maint" style="width:auto" /> Maintenance</label>
        <label class="small muted">Message</label><textarea id="maintMsg" rows="2"></textarea>
        <div class="row" style="margin-top:8px"><div style="flex:1"><label class="small muted">Min ₹</label><input id="minTopup" type="number" /></div>
          <div style="flex:1"><label class="small muted">Max ₹</label><input id="maxTopup" type="number" /></div></div>
        <button id="saveSettings" style="width:100%;margin-top:10px">Save</button>
      </div>
      <div class="card"><h2>Pricing (₹)</h2>
        <table><thead><tr><th>Plan</th><th>Retail</th><th>Reseller</th><th>On</th></tr></thead><tbody id="pricing"></tbody></table>
        <label class="small muted" style="display:block;margin-top:10px">Reseller fee ₹</label><input id="rslFee" type="number" />
        <label class="small muted" style="display:block;margin-top:6px">Unlimited multiplier</label><input id="mult" type="number" step="0.1" />
        <button id="savePricing" style="width:100%;margin-top:10px">Save</button>
      </div>
      <div class="card"><h2>Manual Issue</h2>
        <input id="gkUser" placeholder="telegram id" />
        <select id="gkPlan" style="margin-top:6px"></select>
        <select id="gkDev" style="margin-top:6px"><option value="single">1 device</option><option value="unlimited">unlimited</option></select>
        <button id="gkBtn" style="width:100%;margin-top:10px">Send Key</button>
      </div>
    </div>
  </div>
</div>
<div id="modal"><img id="modalImg" alt="" /></div>
<div id="toast"></div>

<script>
let S = null;
const $ = i => document.getElementById(i);
const inr = p => '₹' + (Math.round(p) / 100);
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2600); };

async function api(p, b) {
  const r = await fetch(p, { method: b === undefined ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json', 'X-Panel': '1' }, body: b === undefined ? undefined : JSON.stringify(b) });
  if (r.status === 401) { $('login').style.display = 'flex'; throw new Error('unauth'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}

$('pwBtn').onclick = async () => { try { await api('/api/login', { password: $('pw').value }); $('login').style.display = 'none'; load(); } catch { $('pwErr').style.display = 'block'; } };
$('pw').onkeydown = e => { if (e.key === 'Enter') $('pwBtn').click(); };
$('logout').onclick = async () => { await api('/api/logout', {}); $('login').style.display = 'flex'; };
$('refresh').onclick = load;
$('backup').onclick = async () => {
  const r = await fetch('/api/backup', { headers: { 'X-Panel': '1' } });
  if (!r.ok) return toast('failed');
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = 'pc5-state.json'; a.click();
};
$('restoreBtn').onclick = () => $('restoreFile').click();
$('restoreFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { await api('/api/restore', JSON.parse(await f.text())); toast('restored'); load(); } catch (x) { toast(x.message); }
};

function draw() {
  const st = S.stats;
  $('stats').innerHTML = [['Users', st.users], ['Resellers', st.resellers], ['Credit', inr(st.creditHeld)], ['In stock', st.available], ['Sold', st.sold], ['Pending', st.pending]]
    .map(([k, v]) => `<div class="stat"><b>${v}</b><i>${k}</i></div>`).join('');

  $('stockSummary').innerHTML = S.pricing.plans.map(p => {
    const s = S.stockSummary[p.id] || { single: 0, unlimited: 0 };
    return `<tr><td>${p.label}</td><td class="${s.single ? '' : 'low'}">${s.single}</td><td class="${s.unlimited ? '' : 'low'}">${s.unlimited}</td></tr>`;
  }).join('');

  const f = $('stockFilter').value.toLowerCase();
  $('stockList').innerHTML = S.stock.filter(k => !f || k.key.toLowerCase().includes(f)).map(k => {
    const p = S.pricing.plans.find(x => x.id === k.planId);
    return `<tr><td class="key">${k.key}</td><td>${p ? p.label : k.planId}</td><td>${k.deviceLimit}</td><td><button class="ghost" data-del="${k.key}">del</button></td></tr>`;
  }).join('') || '<tr><td colspan="4" class="muted">empty</td></tr>';

  $('pending').innerHTML = S.orders.filter(o => o.status === 'pending_review').map(o => `
    <tr><td>${o.id}</td><td>${o.userId}</td><td><span class="tag ${o.type === 'reseller' ? 'rsl' : 'norm'}">${o.type}</span></td><td>${inr(o.amount)}</td>
    <td>${o.screenshotFileId ? `<img class="shot" src="/api/shot/${o.id}" data-shot="${o.id}" />` : '—'}</td>
    <td><div class="row"><button class="ok" data-ok="${o.id}">✓</button><button class="warn" data-no="${o.id}">✕</button></div></td></tr>`).join('')
    || '<tr><td colspan="6" class="muted">nothing</td></tr>';

  const q = $('search').value.toLowerCase();
  $('users').innerHTML = S.users.filter(u => !q || String(u.id).includes(q) || (u.username || '').toLowerCase().includes(q)).map(u => `
    <tr><td>${u.id}</td><td>${u.firstName || ''}${u.username ? ' <span class="muted small">@' + u.username + '</span>' : ''}${u.banned ? ' <span class="tag banned">ban</span>' : ''}</td>
    <td><span class="tag ${u.tier === 'reseller' ? 'rsl' : 'norm'}">${u.tier}</span></td><td>${inr(u.credit)}</td><td>${u.keyCount}</td>
    <td><div class="row"><button class="ghost" data-credit="${u.id}">₹</button><button class="ghost" data-tier="${u.id}">${u.tier === 'reseller' ? 'un-rsl' : 'rsl'}</button><button class="ghost" data-ban="${u.id}">${u.banned ? 'unban' : 'ban'}</button></div></td></tr>`).join('')
    || '<tr><td colspan="6" class="muted">none</td></tr>';

  $('orders').innerHTML = S.orders.slice(0, 50).map(o => `
    <tr><td>${o.id}</td><td>${o.userId}</td><td>${o.type}</td><td>${inr(o.amount)}</td>
    <td><span class="tag ${['approved', 'completed'].includes(o.status) ? 'ok' : o.status === 'rejected' ? 'rej' : o.status === 'pending_review' ? 'pend' : 'norm'}">${o.status}</span></td>
    <td class="key">${o.key || '—'}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">none</td></tr>';

  $('log').innerHTML = S.log.map(l => `<div>${new Date(l.at).toLocaleTimeString()} · ${l.actor} · ${l.text}</div>`).join('');

  $('upiId').value = S.settings.upiId || '';
  $('upiName').value = S.settings.upiName || '';
  $('maint').checked = !!S.settings.botMaintenance;
  $('maintMsg').value = S.settings.maintenanceMsg || '';
  $('minTopup').value = S.settings.minTopup / 100;
  $('maxTopup').value = S.settings.maxTopup / 100;
  $('rslFee').value = S.pricing.resellerFee / 100;
  $('mult').value = S.pricing.unlimitedMultiplier;

  $('pricing').innerHTML = S.pricing.plans.map(p => `
    <tr><td>${p.label}</td><td><input type="number" data-pr="${p.id}" value="${p.retail / 100}" style="width:70px"></td>
    <td><input type="number" data-pw="${p.id}" value="${p.reseller / 100}" style="width:70px"></td>
    <td><input type="checkbox" data-on="${p.id}" ${p.on ? 'checked' : ''} style="width:auto"></td></tr>`).join('');

  const opts = S.pricing.plans.map(p => `<option value="${p.id}">${p.label}</option>`).join('');
  $('gkPlan').innerHTML = opts;
  if (!$('addPlan').dataset.r) { $('addPlan').innerHTML = opts; $('addPlan').dataset.r = '1'; }
}

async function load() { try { S = await api('/api/state'); draw(); } catch (e) { if (e.message !== 'unauth') toast(e.message); } }

document.addEventListener('click', async e => {
  const t = e.target;
  try {
    if (t.dataset.shot) { $('modalImg').src = '/api/shot/' + t.dataset.shot; $('modal').style.display = 'flex'; }
    if (t.dataset.ok) { await api(`/api/order/${t.dataset.ok}/approve`, {}); toast('approved'); load(); }
    if (t.dataset.no) { const reason = prompt('Reason') ?? ''; await api(`/api/order/${t.dataset.no}/reject`, { reason }); load(); }
    if (t.dataset.del) { await api('/api/stock/remove', { keys: [t.dataset.del] }); load(); }
    if (t.dataset.credit) { const v = prompt('Credit ₹ (negative to deduct)'); if (v !== null) { await api(`/api/user/${t.dataset.credit}`, { creditDelta: Number(v) }); load(); } }
    if (t.dataset.tier) { const u = S.users.find(x => String(x.id) === t.dataset.tier); await api(`/api/user/${t.dataset.tier}`, { tier: u.tier === 'reseller' ? 'normal' : 'reseller' }); load(); }
    if (t.dataset.ban) { const u = S.users.find(x => String(x.id) === t.dataset.ban); await api(`/api/user/${t.dataset.ban}`, { banned: !u.banned }); load(); }
  } catch (x) { toast(x.message); }
});

$('modal').onclick = () => $('modal').style.display = 'none';
$('search').oninput = draw;
$('stockFilter').oninput = draw;

$('addBtn').onclick = async () => {
  try { const d = await api('/api/stock/add', { planId: $('addPlan').value, deviceLimit: $('addDev').value, text: $('addKeys').value }); toast(`+${d.added}, ${d.dupes} dupes`); $('addKeys').value = ''; load(); }
  catch (x) { toast(x.message); }
};
$('genBtn').onclick = async () => {
  try { const d = await api('/api/stock/gen', { planId: $('addPlan').value, deviceLimit: $('addDev').value, count: Number($('genCount').value) }); toast('+' + d.added); load(); }
  catch (x) { toast(x.message); }
};
$('saveSettings').onclick = async () => {
  await api('/api/settings', { upiId: $('upiId').value, upiName: $('upiName').value, botMaintenance: $('maint').checked, maintenanceMsg: $('maintMsg').value, minTopup: Number($('minTopup').value), maxTopup: Number($('maxTopup').value) });
  toast('saved'); load();
};
$('savePricing').onclick = async () => {
  const plans = S.pricing.plans.map(p => ({ id: p.id, hours: p.hours, label: p.label, retail: Number(document.querySelector(`[data-pr="${p.id}"]`).value), reseller: Number(document.querySelector(`[data-pw="${p.id}"]`).value), on: document.querySelector(`[data-on="${p.id}"]`).checked }));
  await api('/api/pricing', { plans, resellerFee: Number($('rslFee').value), unlimitedMultiplier: Number($('mult').value) });
  toast('saved'); load();
};
$('gkBtn').onclick = async () => {
  try { const d = await api('/api/genkey', { userId: $('gkUser').value.trim(), planId: $('gkPlan').value, deviceLimit: $('gkDev').value }); toast('sent ' + d.key); load(); }
  catch (x) { toast(x.message); }
};
load().catch(() => {});
</script>
</body>
</html>
